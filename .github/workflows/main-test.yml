name: Main test

on:
  push:
    branches: [ better_ci ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Setup Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Setup database
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          psql -h localhost -p 5432 -U postgres -c 'create database chafan_dev;'
          PYTHONPATH=\$PWD alembic upgrade head
          PYTHONPATH=\$PWD python scripts/initial_data.py
        "

    - name: Run unit tests
      # Everything directly under tests/app/, by subtraction rather than by
      # name: the subdirectories below have their own steps, and anything else
      # added there should run without also having to be listed here.
      # test_activity_policy.py and test_events_distribute.py arrived in #167
      # and had never run in CI, because this step named its files one by one.
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          PYTHONPATH=\$PWD pytest --cov=chafan_core/app --cov-report=xml:coverage-unit.xml -v \
            chafan_core/tests/app/ \
            --ignore=chafan_core/tests/app/api \
            --ignore=chafan_core/tests/app/crud \
            --ignore=chafan_core/tests/app/email
        "

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage-unit.xml

  crud-tests-1:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Setup Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Setup database
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          psql -h localhost -p 5432 -U postgres -c 'create database chafan_dev;'
          PYTHONPATH=\$PWD alembic upgrade head
          PYTHONPATH=\$PWD python scripts/initial_data.py
        "

    - name: Run CRUD tests (part 1)
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          PYTHONPATH=\$PWD pytest --cov=chafan_core/app --cov-report=xml:coverage-crud-1.xml -v chafan_core/tests/app/crud/a/
        "

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-crud-1
        path: coverage-crud-1.xml

  crud-tests-2:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Setup Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Setup database
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          psql -h localhost -p 5432 -U postgres -c 'create database chafan_dev;'
          PYTHONPATH=\$PWD alembic upgrade head
          PYTHONPATH=\$PWD python scripts/initial_data.py
        "

    - name: Run CRUD tests (part 2)
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          PYTHONPATH=\$PWD pytest --cov=chafan_core/app --cov-report=xml:coverage-crud-2.xml -v chafan_core/tests/app/crud/b/
        "

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-crud-2
        path: coverage-crud-2.xml

  api-tests:
    runs-on: ubuntu-latest
    env:
      UPLOADS_S3_ENDPOINT_URL: http://localhost:9000
      UPLOADS_S3_ACCESS_KEY_ID: minioadmin
      UPLOADS_S3_SECRET_ACCESS_KEY: minioadmin
      UPLOADS_S3_BUCKET: chafan-test
      UPLOADS_S3_REGION: us-east-1
      UPLOADS_PUBLIC_URL_BASE: https://uploads.cha.fan
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # MinIO exercises the boto3 upload wiring against a real S3-compatible
      # store (provider-neutrality, the 3b goal). Garage's public serving layer
      # can only be verified manually against Storm.
      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Setup Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Setup database
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          psql -h localhost -p 5432 -U postgres -c 'create database chafan_dev;'
          PYTHONPATH=\$PWD alembic upgrade head
          PYTHONPATH=\$PWD python scripts/initial_data.py
        "

    - name: Run API tests
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          PYTHONPATH=\$PWD pytest --cov=chafan_core/app --cov-report=xml:coverage-api.xml chafan_core/tests/app/api/ -v
        "

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-api
        path: coverage-api.xml

  email-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main

    - name: Setup Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: false

    - name: Setup database
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          psql -h localhost -p 5432 -U postgres -c 'create database chafan_dev;'
          PYTHONPATH=\$PWD alembic upgrade head
          PYTHONPATH=\$PWD python scripts/initial_data.py
        "

    - name: Run email tests
      run: |
        set -a
        source env.ci
        set +a
        nix develop --command bash -c "
          set -e
          PYTHONPATH=\$PWD pytest --cov=chafan_core/app --cov-report=xml:coverage-email.xml chafan_core/tests/app/email/ -v
        "

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-email
        path: coverage-email.xml

  coverage-report:
    needs: [unit-tests, crud-tests-1, crud-tests-2, api-tests, email-tests]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all coverage reports
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Install coverage tool
      run: pip install coverage

    - name: Combine and report coverage
      run: |
        coverage combine --keep coverage-*.xml || true
        coverage report || true
        coverage xml -o coverage-combined.xml || true

    - name: Upload combined coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-combined
        path: coverage-combined.xml
        retention-days: 30
